name: Temperature pipeline (every 4 hours)

on:
  schedule:
    - cron: "23 */4 * * *" # every 4 hours at :23 (UTC); off the congested top of the hour
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull data
        env:
          VERTICA_USER_NAME: ${{ secrets.VERTICA_USER_NAME }}
          VERTICA_PASSWORD: ${{ secrets.VERTICA_PASSWORD }}
        run: python db_pull.py

      - name: Run model
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python run_model.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.csv output/predict.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
